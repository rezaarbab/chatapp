name: CI

on:
  push:
  pull_request:

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run libsignal prototype tests
        run: ./gradlew :prototype:test --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-test-reports
          path: prototype/build/reports/tests/

  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :android:connectedAndroidTest --no-daemon --console=plain > android-test.log 2>&1; ADB=$(command -v adb || echo "$ANDROID_HOME/platform-tools/adb"); echo "::warning::adb=$ADB"; "$ADB" devices 2>&1 | while IFS= read -r l; do echo "::warning::D:$l"; done; "$ADB" shell run-as chatapp.android.test cat files/fixture.json > backend/worker/tink-fixture.json 2>/dev/null && echo "::warning::EXP1-ok" || echo "::warning::EXP1-fail"; if [ ! -s backend/worker/tink-fixture.json ]; then "$ADB" shell run-as chatapp.android cat files/fixture.json > backend/worker/tink-fixture.json 2>/dev/null && echo "::warning::EXP2-ok" || echo "::warning::EXP2-fail"; fi; head -c 100 backend/worker/tink-fixture.json 2>/dev/null | while IFS= read -r l; do echo "::warning::FIX:$l"; done; exit 0
      - name: Fixture gate
        run: |
          tail -n 12 android-test.log || true
          if [ ! -s backend/worker/tink-fixture.json ]; then
            echo "::error::Tink fixture missing or empty"
            exit 1
          fi
          echo "fixture OK"
      - name: Run Tink→WebCrypto interop tests in workerd (miniflare)
        working-directory: backend/worker
        run: |
          npm install --no-fund --no-audit
          npx vitest run --reporter=verbose 2>&1 | tee interop-test.log
      - name: Emit failure diagnostics as annotations
        if: failure()
        run: |
          if [ -f android-test.log ]; then
            grep -E "^e: file:|^FAILURE: |^Execution failed for task|Caused by:|What went wrong|FAILED" android-test.log | head -n 25 | while IFS= read -r line; do echo "::error::${line:0:500}"; done || true
          fi
          find android/build/outputs/androidTest-results -name "*.xml" 2>/dev/null | while IFS= read -r f; do
            grep -A4 "<failure" "$f" | head -n 24 | while IFS= read -r line; do echo "::error::${line:0:480}"; done || true
          done
          if [ -f backend/worker/interop-test.log ]; then
            grep -E "FAIL|Error:|AssertionError|✗|×" backend/worker/interop-test.log | head -n 25 | while IFS= read -r line; do echo "::error::${line:0:500}"; done || true
          fi
      - name: Failure diagnostics into step summary
        if: always()
        run: |
          {
            echo "## android-test.log (tail)"
            tail -n 250 android-test.log || true
            echo
            echo "## androidTest results"
            find android/build/outputs -name "*.xml" -print -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/build/
