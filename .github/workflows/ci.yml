name: CI

on:
  push:
  pull_request:

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run libsignal prototype tests
        run: ./gradlew :prototype:test --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-test-reports
          path: prototype/build/reports/tests/

  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build android artifacts (no emulator)
        run: ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest --no-daemon --console=plain > android-build.log 2>&1 || { tail -n 40 android-build.log; exit 1; }; printf '%s' "$ANDROID_HOME/platform-tools/adb" > adb-path.txt
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :android:connectedAndroidTest --no-daemon --console=plain >> android-test.log 2>&1 || ./gradlew :android:connectedAndroidTest --no-daemon --console=plain >> android-test.log 2>&1; ADB=$(cat adb-path.txt); "$ADB" logcat -d -s TINK_FIXTURE > tink-fixture-raw.log 2>&1 || true; exit 0
      - name: Extract interop fixture and gate
        run: |
          tail -n 12 android-test.log || true
          if grep -q "BUILD FAILED" android-test.log; then
            grep -E "^e: file:|Caused by:|FAILED" android-test.log | head -n 20 | while IFS= read -r line; do echo "::error::${line:0:480}"; done || true
            exit 1
          fi
          if [ ! -s tink-fixture-raw.log ]; then
            echo "::error::tink-fixture-raw.log missing or empty"
            exit 1
          fi
          ctx=$(grep -ohE "TINK_CONTEXT=[A-Za-z0-9+/=]+" tink-fixture-raw.log | head -1 | cut -d= -f2-)
          pub=$(grep -ohE "TINK_PUB=[A-Za-z0-9+/=]+" tink-fixture-raw.log | head -1 | cut -d= -f2-)
          sig=$(grep -ohE "TINK_SIG=[A-Za-z0-9+/=]+" tink-fixture-raw.log | head -1 | cut -d= -f2-)
          if [ -z "$ctx" ] || [ -z "$pub" ] || [ -z "$sig" ]; then
            echo "::error::fixture markers not found in logcat dump"
            head -n 10 tink-fixture-raw.log || true
            exit 1
          fi
          printf '{\n  "alg": "Ed25519",\n  "context_b64": "%s",\n  "pub_b64": "%s",\n  "sig_b64": "%s"\n}\n' "$ctx" "$pub" "$sig" > backend/worker/tink-fixture.json
          echo "fixture extracted:"
          cat backend/worker/tink-fixture.json
      - name: Run Tink→WebCrypto interop tests in workerd (miniflare)
        working-directory: backend/worker
        run: |
          npm install --legacy-peer-deps --no-fund --no-audit > npm-install.log 2>&1 || { tail -n 25 npm-install.log; exit 1; }
          set -o pipefail
          npx vitest run --reporter=verbose interop 2>&1 | tee interop-test.log
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: backend/worker
        run: npm install --legacy-peer-deps --no-fund --no-audit > npm-install.log 2>&1 || { tail -n 25 npm-install.log; exit 1; }
      - name: Run migration/auth/token tests (miniflare D1)
        working-directory: backend/worker
        run: |
          set -o pipefail
          npx vitest run --reporter=verbose migrations auth prekeys 2>&1 | tee worker-tests.log
      - name: Emit worker test failure diagnostics
        if: failure()
        working-directory: backend/worker
        run: |
          grep -E "FAIL|✗|×|AssertionError|Error:" worker-tests.log | head -n 8 | while IFS= read -r l; do echo "::error::WT: $(printf '%.320s' "$l")"; done
          tail -n 20 worker-tests.log | while IFS= read -r l; do echo "::error::WT-TAIL: $(printf '%.320s' "$l")"; done
      - name: Emit failure diagnostics as annotations
        if: failure()
        run: |
          if [ -f android-test.log ]; then
            line=$(grep -n "What went wrong" android-test.log | head -1 | cut -d: -f1)
            if [ -n "$line" ]; then
              sed -n "${line},$((line+6))p" android-test.log | while IFS= read -r l; do echo "::error::WWW: $(printf '%.320s' "$l")"; done
            else
              tail -n 6 android-test.log | while IFS= read -r l; do echo "::error::TAIL: $(printf '%.320s' "$l")"; done
            fi
          else
            echo "::error::android-test.log missing (emulator boot or action-level failure)"
          fi
          if [ -f backend/worker/interop-test.log ]; then
            grep -E "FAIL|✗|×|AssertionError|Error:|failed" backend/worker/interop-test.log | head -n 6 | while IFS= read -r l; do echo "::error::VITEST: $(printf '%.320s' "$l")"; done
            tail -n 12 backend/worker/interop-test.log | while IFS= read -r l; do echo "::error::VT: $(printf '%.320s' "$l")"; done
          elif [ -f backend/worker/npm-install.log ]; then
            tail -n 15 backend/worker/npm-install.log | while IFS= read -r l; do echo "::error::NPM: $(printf '%.320s' "$l")"; done
          else
            echo "::error::no interop-test.log and no npm-install.log (npm install never started)"
          fi
      - name: Failure diagnostics into step summary
        if: always()
        run: |
          {
            echo "## android-test.log (tail)"
            tail -n 250 android-test.log || true
            echo
            echo "## androidTest results"
            find android/build/outputs -name "*.xml" -print -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/build/
