name: CI

on:
  push:
  pull_request:

jobs:
  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app APK + run unit tests
        run: |
          rm -f app-build.log
          if ! ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain > app-build.log 2>&1; then
            grep -E "^e: |error:|What went wrong|Caused by:|FAILURE:" app-build.log | head -n 20 | while IFS= read -r l; do echo "::error::APP: $(printf '%.360s' "$l")"; done
            tail -n 30 app-build.log | while IFS= read -r l; do echo "::error::APP-TAIL: $(printf '%.360s' "$l")"; done
            exit 1
          fi
          if ! grep -q "BUILD SUCCESSFUL" app-build.log; then
            echo "::error::APP: no BUILD SUCCESSFUL marker in app-build.log"
            tail -n 20 app-build.log | while IFS= read -r l; do echo "::error::APP-TAIL: $(printf '%.360s' "$l")"; done
            exit 1
          fi
      - name: Enforce no-logging rule in :app (design §12)
        run: |
          violations=$(grep -rnE "Log\.|println\(" app/src/main/kotlin app/src/test app/src/androidTest 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "$violations" | head -n 10 | while IFS= read -r l; do echo "::error::NO-LOG: $l"; done
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload app unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-test-reports
          path: app/build/reports/tests/

  app-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app + androidTest APKs (no emulator)
        run: |
          printf '%s' "$ANDROID_HOME/platform-tools/adb" > adb-path.txt
          if ! ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain > app-e2e-build.log 2>&1; then
            grep -E "^e: |error:|What went wrong|Caused by:|FAILURE:" app-e2e-build.log | head -n 20 | while IFS= read -r l; do echo "::error::E2EBUILD: $(printf '%.360s' "$l")"; done
            tail -n 25 app-e2e-build.log | while IFS= read -r l; do echo "::error::E2EBUILD-TAIL: $(printf '%.360s' "$l")"; done
            exit 1
          fi
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Phase-5 acceptance journey on emulator (real UI, real staging)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            rm -f app-e2e.log
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain >> app-e2e.log 2>&1 || true
            if grep -q "BUILD SUCCESSFUL" app-e2e.log; then RESULT=0; else RESULT=1; fi
            ADB=$(cat adb-path.txt)
            "$ADB" logcat -d > app-e2e-logcat.log 2>&1 || true
            exit $RESULT
      - name: Emit e2e failure diagnostics
        if: failure()
        run: |
          if [ -f app-e2e.log ]; then
            line=$(grep -n "What went wrong" app-e2e.log | head -1 | cut -d: -f1)
            if [ -n "$line" ]; then
              sed -n "${line},$((line+8))p" app-e2e.log | while IFS= read -r l; do echo "::error::E2E: $(printf '%.320s' "$l")"; done
            else
              tail -n 8 app-e2e.log | while IFS= read -r l; do echo "::error::E2E-TAIL: $(printf '%.320s' "$l")"; done
            fi
            grep -E "FAILED|failed," app-e2e.log | head -n 12 | while IFS= read -r l; do echo "::error::E2E-FAIL: $(printf '%.320s' "$l")"; done
          else
            echo "::error::app-e2e.log missing (emulator boot failure)"
          fi
          if [ -f app-e2e-logcat.log ]; then
            echo "::error::=== TestRunner blocks ==="
            grep -E "TestRunner|FATAL|AndroidRuntime" app-e2e-logcat.log | head -n 80 | while IFS= read -r l; do echo "::error::LC: $(printf '%.400s' "$l")"; done
          fi
      - name: E2E results into step summary
        if: always()
        run: |
          {
            echo "## app-e2e.log (tail 250)"
            tail -n 250 app-e2e.log 2>/dev/null || true
            echo
            echo "## Phase-5 acceptance JUnit XML"
            find app/build/outputs/androidTest-results -name "*.xml" -print -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-reports
          path: |
            app/build/outputs/androidTest-results/
            app-e2e.log
            app-e2e-logcat.log
          if-no-files-found: warn

  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run libsignal prototype tests
        run: ./gradlew :prototype:test --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-test-reports
          path: prototype/build/reports/tests/

  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build android artifacts (no emulator)
        run: |
          printf '%s' "$ANDROID_HOME/platform-tools/adb" > adb-path.txt
          if ! ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest --no-daemon --console=plain > android-build.log 2>&1; then
            grep -E "^e: |error:|What went wrong|Caused by:|FAILURE:" android-build.log | head -n 16 | while IFS= read -r l; do echo "::error::BUILD: $(printf '%.360s' "$l")"; done
            tail -n 25 android-build.log | while IFS= read -r l; do echo "::error::BUILD-TAIL: $(printf '%.360s' "$l")"; done
            exit 1
          fi
      - name: Upload debug AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-aar
          path: android/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: rm -f android-test.log; ./gradlew :android:connectedAndroidTest --no-daemon --console=plain >> android-test.log 2>&1 || ./gradlew :android:connectedAndroidTest --no-daemon --console=plain >> android-test.log 2>&1; if grep -q "BUILD SUCCESSFUL" android-test.log; then RESULT=0; else RESULT=1; fi; ADB=$(cat adb-path.txt); "$ADB" logcat -d > logcat-full.log 2>&1 || true; "$ADB" logcat -d -s TINK_FIXTURE > tink-fixture-raw.log 2>&1 || true; exit $RESULT
      - name: Extract interop fixture and gate
        run: |
          tail -n 12 android-test.log || true
          if ! grep -q "BUILD SUCCESSFUL" android-test.log; then
            echo "::error::instrumented tests failed - full diagnostics in the next step"
            exit 1
          fi
          if [ ! -s tink-fixture-raw.log ]; then
            echo "::error::tink-fixture-raw.log missing or empty"
            exit 1
          fi
          ctx=$(grep -ohE "TINK_CONTEXT=[A-Za-z0-9+/=]+" tink-fixture-raw.log | head -1 | cut -d= -f2-)
          pub=$(grep -ohE "TINK_PUB=[A-Za-z0-9+/=]+" tink-fixture-raw.log | head -1 | cut -d= -f2-)
          sig=$(grep -ohE "TINK_SIG=[A-Za-z0-9+/=]+" tink-fixture-raw.log | head -1 | cut -d= -f2-)
          if [ -z "$ctx" ] || [ -z "$pub" ] || [ -z "$sig" ]; then
            echo "::error::fixture markers not found in logcat dump"
            head -n 10 tink-fixture-raw.log || true
            exit 1
          fi
          printf '{\n  "alg": "Ed25519",\n  "context_b64": "%s",\n  "pub_b64": "%s",\n  "sig_b64": "%s"\n}\n' "$ctx" "$pub" "$sig" > backend/worker/tink-fixture.json
          echo "fixture extracted:"
          cat backend/worker/tink-fixture.json
      - name: Run Tink→WebCrypto interop tests in workerd (miniflare)
        working-directory: backend/worker
        run: |
          npm install --legacy-peer-deps --no-fund --no-audit > npm-install.log 2>&1 || { tail -n 25 npm-install.log; exit 1; }
          set -o pipefail
          npx vitest run --reporter=verbose interop 2>&1 | tee interop-test.log
      - name: Emit android failure diagnostics
        if: failure()
        run: |
          if [ -f android-test.log ]; then
            line=$(grep -n "What went wrong" android-test.log | head -1 | cut -d: -f1)
            if [ -n "$line" ]; then
              sed -n "${line},$((line+6))p" android-test.log | while IFS= read -r l; do echo "::error::WWW: $(printf '%.320s' "$l")"; done
            else
              tail -n 6 android-test.log | while IFS= read -r l; do echo "::error::TAIL: $(printf '%.320s' "$l")"; done
            fi
          else
            echo "::error::android-test.log missing (emulator boot or action-level failure)"
          fi
          echo "::error::=== JUnit XML failure stack traces ==="
          find android/build/outputs/androidTest-results -name "*.xml" -print 2>/dev/null | sort | while IFS= read -r f; do
            python3 scripts/xml-fail-annotations.py "$f"
          done
          if [ -s logcat-full.log ]; then
            echo "::error::=== logcat TestRunner exception blocks ==="
            awk '/begin exception/{flag=1; n=0} flag{print; n++} /end exception/{flag=0} n>=40{print "  ..."; flag=0}' logcat-full.log | head -n 200 | while IFS= read -r l; do echo "::error::LC: $(printf '%.450s' "$l")"; done
          fi
      - name: Android diagnostics into step summary
        if: always()
        run: |
          {
            echo "## android-test.log (tail 300)"
            tail -n 300 android-test.log 2>/dev/null || true
            echo
            echo "## JUnit XML results"
            find android/build/outputs/androidTest-results -name "*.xml" -print -exec cat {} \; 2>/dev/null || true
            echo
            echo "## logcat TestRunner (head 400)"
            grep -E "TestRunner" logcat-full.log 2>/dev/null | head -n 400 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/build/outputs/androidTest-results/
            android/build/reports/
            android-test.log
            logcat-full.log
            tink-fixture-raw.log
          if-no-files-found: warn

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: backend/worker
        run: npm install --legacy-peer-deps --no-fund --no-audit > npm-install.log 2>&1 || { tail -n 25 npm-install.log; exit 1; }
      - name: Run migration/auth/token/prekey/message tests (miniflare D1)
        working-directory: backend/worker
        run: |
          set -o pipefail
          npx vitest run --reporter=verbose migrations auth prekeys messages 2>&1 | tee worker-tests.log
      - name: Emit worker test failure diagnostics
        if: failure()
        working-directory: backend/worker
        run: |
          grep -E "FAIL|✗|×|AssertionError|Error:" worker-tests.log | head -n 8 | while IFS= read -r l; do echo "::error::WT: $(printf '%.320s' "$l")"; done
          tail -n 20 worker-tests.log | while IFS= read -r l; do echo "::error::WT-TAIL: $(printf '%.320s' "$l")"; done
      - name: Worker test diagnostics into step summary
        if: always()
        working-directory: backend/worker
        run: |
          {
            echo "## worker-tests.log (tail 120)"
            tail -n 120 worker-tests.log 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
